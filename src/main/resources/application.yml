server:
  port: ${NIRMAANSETU_SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: nirmaansetu-backend

  datasource:
    url: ${NIRMAANSETU_DATABASE_URL:jdbc:postgresql://localhost:5432/nirmaansetu}
    username: ${NIRMAANSETU_DATABASE_USERNAME:nirmaansetu}
    password: ${NIRMAANSETU_DATABASE_PASSWORD:nirmaansetu_dev_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 5000

  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    out-of-order: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

auth:
  otp:
    ttl: ${NIRMAANSETU_OTP_TTL:PT10M}
    max-attempts: 5
    retention: P1D
    dev-mode: ${NIRMAANSETU_OTP_DEV_MODE:true}
  session:
    ttl: ${NIRMAANSETU_SESSION_TTL:PT12H}

nirmaansetu:
  upload:
    dir: ${NIRMAANSETU_UPLOAD_DIR:uploads}
  cors:
    allowed-origin-patterns: ${NIRMAANSETU_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://*.pages.dev,https://*.nirmaansetu.in,capacitor://localhost,http://localhost}
  sms:
    provider: ${NIRMAANSETU_SMS_PROVIDER:dev}
    api-key: ${NIRMAANSETU_SMS_API_KEY:}
    sender-id: ${NIRMAANSETU_SMS_SENDER_ID:}
    template-id: ${NIRMAANSETU_SMS_TEMPLATE_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
