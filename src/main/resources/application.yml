spring:
  application:
    name: nirmaansetu-backend
  datasource:
    url: ${NIRMAANSETU_DATABASE_URL:jdbc:postgresql://localhost:5432/nirmaansetu}
    username: ${NIRMAANSETU_DATABASE_USERNAME:nirmaansetu}
    password: ${NIRMAANSETU_DATABASE_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

auth:
  otp:
    ttl: PT10M
    max-attempts: 5
    retention: P1D
  session:
    ttl: PT12H
