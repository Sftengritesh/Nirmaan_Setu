spring:
  application:
    name: nirmaansetu-backend-test

  datasource:
    url: jdbc:h2:mem:nirmaansetutestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

auth:
  otp:
    ttl: PT10M
    max-attempts: 5
    retention: P1D
  session:
    ttl: PT12H
