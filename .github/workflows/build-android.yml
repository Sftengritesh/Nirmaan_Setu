name: Build Android App (AAB & APK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.nirmaansetu.in
          VITE_APP_ENV: production
        run: npm run build

      - name: Sync Web Assets with Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Signed Android App Bundle (AAB) & APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: nirmaansetu-release-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: nirmaansetu-release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
